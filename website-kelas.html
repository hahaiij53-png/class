<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas VIIIB — Ruang Kelas Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23324a;
    --ink-soft:#4a5a72;
    --paper:#f3f0e8;
    --paper-line:#e2ddcd;
    --white:#fffdf8;
    --gold:#b9922f;
    --gold-soft:#e9d9ad;
    --sage:#5f7d63;
    --sage-soft:#dfe7de;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    background-image: repeating-linear-gradient(var(--paper) 0px, var(--paper) 34px, var(--paper-line) 35px);
  }
  h1,h2,h3{ font-family:'Fraunces', serif; color:var(--ink); font-weight:600; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  /* ===== LOGIN GATE ===== */
  #gate{
    position:fixed; inset:0; z-index:100;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  #gate::before{
    content:"";
    position:absolute; inset:0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 100% 36px;
    pointer-events:none;
  }
  .gate-card{
    position:relative;
    width:100%; max-width:380px;
    background:var(--white);
    padding:44px 36px 36px;
    border-radius:var(--radius);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .gate-badge{
    width:46px; height:46px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:20px;
    color:var(--gold);
    margin-bottom:20px;
  }
  .gate-card h1{ font-size:26px; line-height:1.25; margin-bottom:6px; }
  .gate-card p.sub{ color:var(--ink-soft); font-size:14px; margin-bottom:28px; }
  .field-label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  #passwordInput{
    width:100%;
    padding:12px 14px;
    border:1px solid #d8d2c2;
    border-radius:var(--radius);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  #passwordInput:focus{ border-color:var(--gold); }
  #gateBtn{
    width:100%;
    margin-top:16px;
    padding:12px 14px;
    border:none;
    border-radius:var(--radius);
    background:var(--ink);
    color:var(--white);
    font-family:'Work Sans', sans-serif;
    font-size:15px; font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  #gateBtn:hover{ background:#33456380; background:#324563; }
  #gateBtn:disabled{ opacity:.6; cursor:not-allowed; }
  #gateError{
    margin-top:14px;
    font-size:13px;
    color:#a13d3d;
    min-height:16px;
  }
  .gate-hint{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--paper-line);
    font-size:12px;
    color:#9a9384;
  }

  /* ===== SUCCESS POPUP ===== */
  #successPopup{
    position:fixed; inset:0; z-index:200;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(35,50,74,0.55);
    backdrop-filter:blur(2px);
  }
  #successPopup.show{ display:flex; }
  .popup-card{
    background:var(--white);
    padding:38px 44px;
    border-radius:var(--radius);
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
    opacity:0; transform:scale(0.85);
    animation:popIn 0.45s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .popup-check{
    width:54px; height:54px;
    border-radius:50%;
    background:var(--sage-soft);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px;
  }
  .popup-check svg{ width:26px; height:26px; }
  .popup-check path{
    stroke:var(--sage); stroke-width:3; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:drawCheck 0.4s ease 0.35s forwards;
  }
  .popup-card h3{ font-size:19px; margin-bottom:4px; }
  .popup-card p{ font-size:13.5px; color:var(--ink-soft); }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(0.8) translateY(10px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes drawCheck{ to{ stroke-dashoffset:0; } }

  /* ===== SITE ===== */
  #site{ display:none; }
  header.top{
    max-width:920px; margin:0 auto;
    padding:64px 24px 40px;
  }
  .eyebrow-line{
    display:flex; align-items:center; gap:12px;
    color:var(--sage); font-size:13px; margin-bottom:18px;
  }
  .eyebrow-line span.dot{ width:6px; height:6px; background:var(--sage); border-radius:50%; display:inline-block; }
  header.top h1{ font-size:48px; letter-spacing:-0.5px; margin-bottom:14px; }
  header.top p.desc{ max-width:520px; color:var(--ink-soft); font-size:16px; }
  nav.tabs{
    max-width:920px; margin:0 auto;
    padding:0 24px 8px;
    display:flex; gap:28px;
    border-bottom:1px solid var(--paper-line);
  }
  nav.tabs button{
    background:none; border:none; cursor:pointer;
    font-family:'Work Sans', sans-serif; font-size:14px; font-weight:600;
    color:var(--ink-soft);
    padding:12px 2px 16px;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button.active{ color:var(--ink); border-color:var(--gold); }
  nav.tabs button:hover{ color:var(--ink); }

  main{ max-width:920px; margin:0 auto; padding:48px 24px 100px; }
  section{ display:none; }
  section.active{ display:block; }
  section h2{ font-size:28px; margin-bottom:8px; }
  section p.section-desc{ color:var(--ink-soft); font-size:15px; margin-bottom:32px; max-width:560px; }

  /* documentation gallery */
  .gallery{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .gallery figure{
    position:relative;
    background:var(--white);
    border:1px solid var(--paper-line);
    overflow:hidden;
    aspect-ratio:4/3;
  }
  .gallery figure img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease; }
  .gallery figure:hover img{ transform:scale(1.05); }
  .gallery figcaption{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 12px;
    background:linear-gradient(to top, rgba(35,50,74,0.82), transparent);
    color:#fff; font-size:12.5px;
  }

  /* jadwal piket */
  .piket-table{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border:1px solid var(--paper-line);
  }
  .piket-table th, .piket-table td{
    text-align:left;
    padding:14px 16px;
    border-bottom:1px solid var(--paper-line);
    font-size:14px;
  }
  .piket-table th{
    background:var(--ink);
    color:var(--white);
    font-weight:500;
    font-size:13px;
  }
  .piket-table tr:last-child td{ border-bottom:none; }
  .piket-table td.hari{ font-family:'Fraunces', serif; font-weight:600; color:var(--gold); white-space:nowrap; }
  .piket-table tr:hover td{ background:#faf8f2; }

  /* anggota */
  .anggota-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--paper-line);
    border:1px solid var(--paper-line);
  }
  .anggota-card{
    background:var(--white);
    padding:18px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .avatar{
    width:36px; height:36px;
    border-radius:50%;
    background:var(--sage-soft);
    color:var(--sage);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:14px;
  }
  .anggota-card .nama{ font-size:14px; font-weight:600; }
  .anggota-card .no{ font-size:12px; color:var(--ink-soft); }

  footer{
    max-width:920px; margin:0 auto;
    padding:28px 24px 60px;
    color:#9a9384; font-size:12.5px;
    border-top:1px solid var(--paper-line);
  }

  @media (max-width:720px){
    header.top h1{ font-size:36px; }
    .gallery{ grid-template-columns:repeat(2,1fr); }
    .anggota-grid{ grid-template-columns:repeat(2,1fr); }
    nav.tabs{ gap:18px; overflow-x:auto; }
  }
</style>
</head>
<body>

  <!-- ============ LOGIN GATE ============ -->
  <div id="gate">
    <form class="gate-card" id="gateForm" autocomplete="off">
      <div class="gate-badge">VIII</div>
      <h1>Masuk Ruang Kelas</h1>
      <p class="sub">Halaman ini khusus untuk anggota kelas VIIIB . Masukkan kata sandi admin untuk melanjutkan.</p>

      <label class="field-label" for="passwordInput">Kata sandi</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autofocus>
      <button type="submit" id="gateBtn">Buka Halaman</button>
      <div id="gateError"></div>

      <div class="gate-hint">Belum punya kata sandi? Hubungi ketua kelas atau admin.</div>
    </form>
  </div>

  <!-- ============ SUCCESS POPUP ============ -->
  <div id="successPopup">
    <div class="popup-card">
      <div class="popup-check">
        <svg viewBox="0 0 24 24"><path d="M4 12.5L9.5 18L20 6"/></svg>
      </div>
      <h3>Berhasil Masuk</h3>
      <p>Selamat datang di ruang kelas VIIIB</p>
    </div>
  </div>

  <!-- ============ SITE CONTENT ============ -->
  <div id="site"></div>

  const MAX_TRIES = 5;          // percobaan salah sebelum dikunci sementara
  const BASE_LOCK_SEC = 30;     // lama kunci awal (detik), berlipat tiap kali terkunci
  const MAX_LOCK_SEC = 600;     // maksimal 10 menit

  const gate = document.getElementById('gate');
  const gateForm = document.getElementById('gateForm');
  const passwordInput = document.getElementById('passwordInput');
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  const site = document.getElementById('site');
  const successPopup = document.getElementById('successPopup');

  // --- penyimpanan percobaan gagal (dibungkus try/catch agar aman) ---
  function loadState(){
    try { return JSON.parse(localStorage.getItem('gateState')) || {fails:0, locks:0, until:0}; }
    catch(e){ return {fails:0, locks:0, until:0}; }
  }
  function saveState(s){
    try { localStorage.setItem('gateState', JSON.stringify(s)); } catch(e){}
  }

  let lockTimer = null;
  function showLock(){
    clearInterval(lockTimer);
    const tick = () => {
      const left = Math.ceil((loadState().until - Date.now()) / 1000);
      if(left > 0){
        gateBtn.disabled = true;
        gateError.textContent = 'Terlalu banyak percobaan. Coba lagi dalam ' + left + ' detik.';
      } else {
        clearInterval(lockTimer);
        gateBtn.disabled = false;
        gateError.textContent = '';
      }
    };
    tick();
    lockTimer = setInterval(tick, 500);
  }
  if(loadState().until > Date.now()) showLock();

  // --- dekripsi isi website ---
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decryptSite(password){
    const keyMat = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:fromB64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
      keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:fromB64(PAYLOAD.iv)}, key, fromB64(PAYLOAD.data));
    return JSON.parse(new TextDecoder().decode(buf));
  }

  gateForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const state = loadState();
    if(state.until > Date.now()){ showLock(); return; }
    if(!window.crypto || !crypto.subtle){
      gateError.textContent = 'Browser ini tidak mendukung enkripsi. Buka lewat https:// atau browser terbaru.';
      return;
    }

    const pw = passwordInput.value;
    gateBtn.disabled = true;
    gateBtn.textContent = 'Memeriksa...';
    gateError.textContent = '';

    let content = null;
    try { content = await decryptSite(pw); } catch(err){ content = null; }

    gateBtn.textContent = 'Buka Halaman';
    gateBtn.disabled = false;

    if(content){
      saveState({fails:0, locks:0, until:0});
      passwordInput.value = '';
      gate.style.display = 'none';
      successPopup.classList.add('show');
      setTimeout(() => {
        successPopup.classList.remove('show');
        site.innerHTML = content.html;
        const s = document.createElement('script');
        s.textContent = content.js;
        document.body.appendChild(s);
        site.style.display = 'block';
      }, 1300);
    } else {
      state.fails += 1;
      passwordInput.value = '';
      if(state.fails >= MAX_TRIES){
        state.locks += 1;
        state.fails = 0;
        const sec = Math.min(BASE_LOCK_SEC * Math.pow(2, state.locks - 1), MAX_LOCK_SEC);
        state.until = Date.now() + sec * 1000;
        saveState(state);
        showLock();
      } else {
        saveState(state);
        gateError.textContent = 'Kata sandi salah. Sisa percobaan: ' + (MAX_TRIES - state.fails) + '.';
        passwordInput.focus();
      }
    }
  });
</script>
